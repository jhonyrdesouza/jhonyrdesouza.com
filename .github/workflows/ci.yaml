name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - development
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run linter
        run: pnpm lint

  transpile:
    name: Transpile code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run transpile
        run: pnpm transpile

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint, transpile]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development')
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }} \
            --token=${{ env.VERCEL_TOKEN }} \
            --scope=${{ env.VERCEL_ORG_ID }}

      - name: Build with Vercel
        run: |
          vercel build \
            ${{ github.ref == 'refs/heads/master' && '--prod' || '' }} \
            --token=${{ env.VERCEL_TOKEN }} \
            --scope=${{ env.VERCEL_ORG_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt \
            ${{ github.ref == 'refs/heads/master' && '--prod' || '' }} \
            --token=${{ env.VERCEL_TOKEN }} \
            --scope=${{ env.VERCEL_ORG_ID }})"

          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url" >> $GITHUB_STEP_SUMMARY
