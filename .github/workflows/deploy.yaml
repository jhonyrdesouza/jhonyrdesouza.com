name: Deploy

on:
  workflow_run:
    workflows: ["Prepare Code Quality Checks"]
    types:
      - completed
    branches:
      - master
      - development

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NODE_ENV: ${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=${{ env.NODE_ENV }} --token=${{ env.VERCEL_TOKEN }} --scope=${{ env.VERCEL_ORG_ID }}

      - name: Build project
        run: vercel build ${{ github.ref == 'refs/heads/master' && '--prod' || '' }} --token=${{ env.VERCEL_TOKEN }} --scope=${{ env.VERCEL_ORG_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/master' && '--prod' || '' }} --token=${{ env.VERCEL_TOKEN }} --scope=${{ env.VERCEL_ORG_ID }})"
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"