version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    assignees:
      - "jhonyrdesouza"
    labels:
      - "automated"
      - "dependencies"
      - "packages"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    assignees:
      - "jhonyrdesouza"
    labels:
      - "automated"
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
